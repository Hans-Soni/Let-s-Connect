    <meta charset="UTF-8" />

    <title>Samवाद — Private Real-Time Chat & HD Calling</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("chat-theme") || localStorage.getItem("samvaad-theme") || localStorage.getItem("samvad-theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
