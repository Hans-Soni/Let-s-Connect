name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix frontend

      - name: Build Web Application
        run: npm run build --prefix frontend

      - name: Sync Capacitor Android
        run: npx cap sync android --prefix frontend

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samvaad-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release Latest APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Samवाद Android App (Latest APK)"
          body: |
            ### 📲 Samवाद Android APK — 1-Click Installation
            Direct download for Samवाद Android APK build:
            - **WebRTC HD Voice/Video Calling**
            - **Zero-knowledge AES-256-GCM Encrypted Messaging**
            - **No Browser URL Bar — Full Native Feel**
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

