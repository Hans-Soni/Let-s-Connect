name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix frontend

      - name: Build Web Application
        run: npm run build --prefix frontend

      - name: Sync Capacitor Android
        run: npx cap sync android --prefix frontend

      - name: Make Gradlew Executable
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: Samvaad-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release Latest APK
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Samवाद Android App (Latest APK)"
          body: |
            ### 📲 Samवाद Android APK — 1-Click Installation
            Direct download for Samवाद Android APK build:
            - **WebRTC HD Voice/Video Calling**
            - **Zero-knowledge AES-256-GCM Encrypted Messaging**
            - **No Browser URL Bar — Full Native Feel**
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

